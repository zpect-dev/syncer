services:
    syncer:
        build: .
        container_name: profit_syncer
        command: /app/syncer
        restart: unless-stopped
        env_file:
            - .env
        # Monta el CA cert de DigitalOcean si usas sslmode=verify-full.
        # Coloca el archivo en ./certs/ca-certificate.crt (descárgalo desde el panel de DO).
        volumes:
            - ./certs:/app/certs:ro
